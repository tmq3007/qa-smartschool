<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA SmartClass — Web Admin Dashboard</title>
    <meta name="description" content="QA SmartClass multi-machine monitoring dashboard for IT administrators">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #e2e8f0; min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 28px; margin-bottom: 28px;
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px);
            border-radius: 16px; border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .header h1 { font-size: 22px; font-weight: 800; color: white; }
        .header h1 span { color: #818cf8; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .header-status {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
            background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .header-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .btn-refresh {
            padding: 8px 18px; border-radius: 10px; border: 1px solid #475569;
            background: rgba(71, 85, 105, 0.4); color: #e2e8f0; font-size: 13px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-refresh:hover { background: rgba(99, 102, 241, 0.3); border-color: #818cf8; }

        /* KPI Bar */
        .kpi-bar {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px;
        }
        .kpi-card {
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px);
            border-radius: 12px; padding: 18px 22px;
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .kpi-card .label { font-size: 12px; color: #94a3b8; font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .kpi-card .value { font-size: 32px; font-weight: 800; color: white; }
        .kpi-card .value.green { color: #34d399; }
        .kpi-card .value.red { color: #f87171; }
        .kpi-card .value.blue { color: #60a5fa; }
        .kpi-card .value.amber { color: #fbbf24; }

        /* Machine Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; margin-bottom: 28px; }
        .card {
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px);
            border-radius: 14px; padding: 22px; border: 1px solid rgba(51, 65, 85, 0.5);
            transition: all 0.25s ease;
        }
        .card:hover { border-color: rgba(99, 102, 241, 0.5); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .card.online { border-left: 4px solid #10b981; }
        .card.offline { border-left: 4px solid #ef4444; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .machine-id { font-size: 17px; font-weight: 700; color: white; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .status-badge.online { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .status-badge.offline { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .info-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; color: #94a3b8; border-bottom: 1px solid rgba(51, 65, 85, 0.3); }
        .info-row:last-child { border-bottom: none; }
        .info-row .val { color: #e2e8f0; font-weight: 500; }

        /* Report Section */
        .report-section {
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(8px);
            border-radius: 14px; padding: 24px; border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .report-section h2 { font-size: 16px; font-weight: 700; color: white; margin-bottom: 16px; }
        .report-table { width: 100%; border-collapse: collapse; }
        .report-table th { text-align: left; padding: 10px 12px; font-size: 12px; color: #94a3b8; border-bottom: 1px solid #334155; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .report-table td { padding: 10px 12px; font-size: 13px; color: #e2e8f0; border-bottom: 1px solid rgba(51, 65, 85, 0.3); }
        .report-table tr:hover td { background: rgba(99, 102, 241, 0.05); }

        .empty-state { text-align: center; padding: 60px; color: #64748b; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .timestamp { font-size: 12px; color: #64748b; }

        @media (max-width: 768px) {
            .kpi-bar { grid-template-columns: repeat(2, 1fr); }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 QA <span>SmartClass</span> — Web Admin</h1>
            <div class="header-right">
                <div class="header-status"><div class="dot"></div> <span id="connectionStatus">Đang kết nối...</span></div>
                <button class="btn-refresh" onclick="loadData()">🔄 Làm mới</button>
            </div>
        </div>

        <div class="kpi-bar">
            <div class="kpi-card"><div class="label">Tổng máy</div><div class="value blue" id="kpiTotal">0</div></div>
            <div class="kpi-card"><div class="label">Online</div><div class="value green" id="kpiOnline">0</div></div>
            <div class="kpi-card"><div class="label">Offline</div><div class="value red" id="kpiOffline">0</div></div>
            <div class="kpi-card"><div class="label">Avg Uptime</div><div class="value amber" id="kpiUptime">0h</div></div>
        </div>

        <div class="grid" id="machineGrid"></div>

        <div class="report-section">
            <h2>📊 Báo Cáo Tổng Hợp</h2>
            <table class="report-table" id="reportTable">
                <thead>
                    <tr>
                        <th>Máy</th>
                        <th>Trạng thái</th>
                        <th>Chế độ</th>
                        <th>Uptime</th>
                        <th>Lần báo cáo cuối</th>
                    </tr>
                </thead>
                <tbody id="reportBody"></tbody>
            </table>
        </div>

        <p class="timestamp" style="margin-top: 16px; text-align: center;">
            Cập nhật lần cuối: <span id="lastUpdate">---</span> | Auto-refresh mỗi 30 giây
        </p>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
